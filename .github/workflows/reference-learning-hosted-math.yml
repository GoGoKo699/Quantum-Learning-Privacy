name: Reference learning hosted mathematics

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  capture:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.number == 3
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      CAPTURE_REVISION: eef8fecd4c2aff65684744c9d0fcad432b93a9e1
      CAPTURE_TREE: 7759045e9439da1912593e94248200859d3ca787
    steps:
      - name: Check out the exact scientific source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: eef8fecd4c2aff65684744c9d0fcad432b93a9e1
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Validate the source and install the capture runtime
        run: |
          test "$(git rev-parse 'HEAD^{tree}')" = "$CAPTURE_TREE"
          mkdir -p "$RUNNER_TEMP/hosted-helpers"
          cd "$RUNNER_TEMP/hosted-helpers"
          curl --fail --silent --show-error --location "https://raw.githubusercontent.com/GoGoKo699/Quantum-Memory-Calibration/213dcbf5013bf7ea63f796e6288ef24963281b23/verification/hosted_math/capture_hosted_math.cjs" --output capture_hosted_math.cjs
          curl --fail --silent --show-error --location "https://raw.githubusercontent.com/GoGoKo699/Quantum-Memory-Calibration/213dcbf5013bf7ea63f796e6288ef24963281b23/verification/hosted_math/check_rendered_math.py" --output check_rendered_math.py
          test "$(git hash-object capture_hosted_math.cjs)" = "d650de78b0bce00d1abf99cadfb66af1a2e80358"
          test "$(git hash-object check_rendered_math.py)" = "1d3bf9810d0dfadb844a48b354af80f9b66924bc"
          npm install --prefix "$RUNNER_TEMP/math-runtime" playwright@1.56.1 mathjax-full@3.2.1
          node "$RUNNER_TEMP/math-runtime/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Compare public GitHub rendering with the scientific source
        run: |
          NODE_PATH="$RUNNER_TEMP/math-runtime/node_modules" node "$RUNNER_TEMP/hosted-helpers/capture_hosted_math.cjs" \
            --root "$GITHUB_WORKSPACE" --repository "$GITHUB_REPOSITORY" --revision "$CAPTURE_REVISION" \
            --output "$RUNNER_TEMP/hosted-math"
      - name: Retain render evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reference-learning-hosted-math
          path: ${{ runner.temp }}/hosted-math
          if-no-files-found: error
          retention-days: 3
